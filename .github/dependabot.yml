version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-and-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns:
          ["eslint", "prettier", "typescript", "@playwright/test", "@axe-core/playwright", "@types/node"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
